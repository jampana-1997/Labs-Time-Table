<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MGIT Lab Time Tables | AY 2026-27</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f7fb;
    color:#111827;
}

/* ================= HEADER ================= */

.header{
    background:#123c69;
    color:white;
    padding:25px 20px;
    text-align:center;
}

.header h1{
    font-size:28px;
    margin-bottom:8px;
}

.header h2{
    font-size:18px;
    font-weight:normal;
    margin-bottom:6px;
}

.header p{
    font-size:15px;
    opacity:.9;
}

/* ================= CONTAINER ================= */

.container{
    max-width:1450px;
    margin:25px auto;
    padding:0 18px;
}

/* ================= FILTER BOX ================= */

.controls{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.controls-title{
    font-size:19px;
    font-weight:bold;
    margin-bottom:16px;
    color:#123c69;
}

.filters{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:15px;
}

.filter-box label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:7px;
    color:#374151;
}

select{
    width:100%;
    padding:11px 10px;
    border:1px solid #d1d5db;
    border-radius:7px;
    background:white;
    color:#111827;
    font-size:14px;
    outline:none;
}

select:focus{
    border-color:#2563eb;
}

/* ================= RESET ================= */

.reset-btn{
    width:100%;
    padding:11px;
    border:none;
    border-radius:7px;
    background:#374151;
    color:white;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.reset-btn:hover{
    background:#111827;
}

/* ================= INFO ================= */

.info{
    display:flex;
    justify-content:space-between;
    align-items:center;

    background:white;
    padding:15px 18px;

    border-radius:10px;
    margin-bottom:15px;

    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.status{
    font-size:14px;
    color:#4b5563;
}

.free-count{
    font-weight:bold;
    color:#15803d;
}

/* ================= TABLE ================= */

.table-container{
    background:white;
    border-radius:12px;

    box-shadow:0 3px 12px rgba(0,0,0,.08);

    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1000px;
}

thead{
    background:#123c69;
    color:white;
}

th{
    padding:13px 10px;
    font-size:13px;
    white-space:nowrap;

    border-right:1px solid rgba(255,255,255,.2);
}

td{
    padding:12px 10px;

    text-align:center;

    border-bottom:1px solid #e5e7eb;
    border-right:1px solid #e5e7eb;

    font-size:13px;
}

/* ================= COLORS ================= */

/* FREE */

.free{
    color:#15803d !important;
    background:#dcfce7;
    font-weight:bold;
}

/* FULL */

.full{
    color:#dc2626 !important;
    background:#fee2e2;
    font-weight:bold;
}

/* OTHER DATA */

.normal{
    color:#111827 !important;
    background:white;
}

/* ================= HOVER ================= */

tbody tr:hover td.normal{
    background:#f8fafc;
}

/* ================= LOADING ================= */

.loading{
    text-align:center;
    padding:40px;

    font-size:16px;
    color:#6b7280;
}

/* ================= ERROR ================= */

.error{
    text-align:center;

    padding:30px;

    color:#b91c1c;
    background:#fee2e2;

    margin:20px 0;

    border-radius:10px;
}

/* ================= FOOTER ================= */

.footer{
    text-align:center;

    padding:25px;

    color:#6b7280;

    font-size:13px;
}

/* ================= MOBILE ================= */

@media(max-width:1100px){

    .filters{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    .header h1{
        font-size:21px;
    }

    .header h2{
        font-size:15px;
    }

    .filters{
        grid-template-columns:1fr;
    }

    .info{
        flex-direction:column;
        gap:8px;
        align-items:flex-start;
    }

}

</style>
</head>

<body>


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <h1>
        Mahatma Gandhi Institute of Technology
    </h1>

    <h2>
        Training and Placement Cell
    </h2>

    <p>
        All Branches Labs Time Tables, AY 2026-27, Odd Semester
    </p>

</div>


<div class="container">


<!-- =====================================================
     FILTERS
===================================================== -->

<div class="controls">

    <div class="controls-title">
        Find Free Labs
    </div>


    <div class="filters">


        <!-- DAY -->

        <div class="filter-box">

            <label>
                Day
            </label>

            <select id="dayFilter">

                <option value="ALL">
                    All Days
                </option>

            </select>

        </div>


        <!-- ROOM -->

        <div class="filter-box">

            <label>
                Room No.
            </label>

            <select id="roomFilter">

                <option value="ALL">
                    All Rooms
                </option>

            </select>

        </div>


        <!-- CAPACITY -->

        <div class="filter-box">

            <label>
                Lab Capacity
            </label>

            <select id="capacityFilter">

                <option value="ALL">
                    All Lab Capacities
                </option>

            </select>

        </div>


        <!-- PERIOD -->

        <div class="filter-box">

            <label>
                Select Period
            </label>

            <select id="periodFilter">

                <option value="ALL">
                    All Periods
                </option>

            </select>

        </div>


        <!-- RESET -->

        <div class="filter-box">

            <label>
                &nbsp;
            </label>

            <button
                class="reset-btn"
                onclick="resetFilters()"
            >
                RESET
            </button>

        </div>


    </div>

</div>


<!-- =====================================================
     INFORMATION
===================================================== -->

<div class="info">

    <div
        class="status"
        id="status"
    >
        Loading timetable...
    </div>


    <div
        class="free-count"
        id="freeCount"
    >
        Free Labs: 0
    </div>

</div>


<!-- =====================================================
     TABLE
===================================================== -->

<div class="table-container">


    <div
        id="loading"
        class="loading"
    >

        Loading data from Google Sheets...

    </div>


    <table
        id="labTable"
        style="display:none;"
    >

        <thead
            id="tableHead"
        ></thead>

        <tbody
            id="tableBody"
        ></tbody>

    </table>


</div>


</div>


<!-- =====================================================
     FOOTER
===================================================== -->

<div class="footer">

    Mahatma Gandhi Institute of Technology |
    Training and Placement Cell

</div>


<script>


/* =====================================================
   GOOGLE SHEET
===================================================== */

const SHEET_ID =
"1PNgEr74LPmWGHzorRV_qvBhbc8sxhEFDjt3gjBtaFOY";


/*
   IMPORTANT:

   If your Google Sheet tab name is NOT Sheet1,
   change this name below.
*/

const SHEET_NAME = "Sheet1";


const GOOGLE_URL =
"https://docs.google.com/spreadsheets/d/" +
SHEET_ID +
"/gviz/tq?tqx=out:json&sheet=" +
encodeURIComponent(SHEET_NAME);


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let allData = [];

let headers = [];


/* =====================================================
   LOAD GOOGLE SHEET
===================================================== */

async function loadSheet(){

    try{

        const response =
            await fetch(GOOGLE_URL);


        if(!response.ok){

            throw new Error(
                "Google Sheet could not be accessed."
            );

        }


        const text =
            await response.text();


        /*
           Google Visualization response
           extract JSON
        */

        const jsonText =
            text.substring(
                text.indexOf("{"),
                text.lastIndexOf("}") + 1
            );


        const json =
            JSON.parse(jsonText);


        const table =
            json.table;


        /* HEADERS */

        headers =
            table.cols.map(
                col => col.label || ""
            );


        /* DATA */

        allData =
            table.rows.map(row => {

                return row.c.map(cell => {

                    if(cell === null){

                        return "";

                    }

                    return cell.f ||
                           cell.v ||
                           "";

                });

            });


        /*
           Remove empty rows
        */

        allData =
            allData.filter(row =>
                row.some(value =>
                    String(value).trim() !== ""
                )
            );


        /*
           Setup filters
        */

        setupFilters();


        /*
           Display complete data
        */

        displayData(allData);


        document.getElementById(
            "loading"
        ).style.display = "none";


        document.getElementById(
            "labTable"
        ).style.display = "table";


        document.getElementById(
            "status"
        ).innerText =
            "Timetable loaded successfully";


    }

    catch(error){

        console.error(error);


        document.getElementById(
            "loading"
        ).innerHTML = `

            <div class="error">

                <strong>
                    Unable to load Google Sheet
                </strong>

                <br><br>

                Please make sure the Google Sheet is shared as:

                <br><br>

                <b>
                    Anyone with the link → Viewer
                </b>

                <br><br>

                Also check the Sheet tab name.

            </div>

        `;

    }

}


/* =====================================================
   SETUP FILTERS
===================================================== */

function setupFilters(){


    const dayFilter =
        document.getElementById(
            "dayFilter"
        );


    const roomFilter =
        document.getElementById(
            "roomFilter"
        );


    const capacityFilter =
        document.getElementById(
            "capacityFilter"
        );


    const periodFilter =
        document.getElementById(
            "periodFilter"
        );


    /* ================= DAY ================= */

    const dayIndex =
        findColumn([
            "Day",
            "DAY",
            "day"
        ]);


    if(dayIndex !== -1){

        const days =
            uniqueValues(dayIndex);


        days.forEach(day => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                day;


            option.textContent =
                day;


            dayFilter.appendChild(
                option
            );

        });

    }


    /* ================= ROOM ================= */

    const roomIndex =
        findColumn([
            "Room No.",
            "Room No",
            "Room",
            "ROOM NO",
            "ROOM"
        ]);


    if(roomIndex !== -1){

        const rooms =
            uniqueValues(roomIndex);


        rooms.forEach(room => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                room;


            option.textContent =
                room;


            roomFilter.appendChild(
                option
            );

        });

    }


    /* ================= CAPACITY ================= */

    const capacityIndex =
        findColumn([
            "Capacity",
            "Lab Capacity",
            "CAPACITY"
        ]);


    if(capacityIndex !== -1){

        const capacities =
            uniqueValues(
                capacityIndex
            );


        capacities.sort(
            (a,b) =>
                Number(a) - Number(b)
        );


        capacities.forEach(
            capacity => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    capacity;


                option.textContent =
                    capacity;


                capacityFilter.appendChild(
                    option
                );

            }
        );

    }


    /* ================= PERIOD ================= */

    headers.forEach(header => {

        const cleanHeader =
            String(header).trim();


        if(isPeriod(cleanHeader)){

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                cleanHeader;


            option.textContent =
                cleanHeader;


            periodFilter.appendChild(
                option
            );

        }

    });


    /* ================= EVENTS ================= */

    dayFilter.addEventListener(
        "change",
        applyFilters
    );


    roomFilter.addEventListener(
        "change",
        applyFilters
    );


    capacityFilter.addEventListener(
        "change",
        applyFilters
    );


    periodFilter.addEventListener(
        "change",
        applyFilters
    );

}


/* =====================================================
   PERIOD DETECTION
===================================================== */

function isPeriod(header){

    const h =
        normalize(header);


    return (

        h.includes("9.10-10.10") ||

        h.includes("10.10-11.10") ||

        h.includes("11.15-12.15") ||

        h.includes("12.15-1.00") ||

        h.includes("1.00-2.00") ||

        h.includes("2.00-3.00") ||

        h.includes("3.05-4.05")

    );

}


/* =====================================================
   DISPLAY TABLE
===================================================== */

function displayData(data){


    const tableHead =
        document.getElementById(
            "tableHead"
        );


    const tableBody =
        document.getElementById(
            "tableBody"
        );


    tableHead.innerHTML = "";

    tableBody.innerHTML = "";


    /* ================= HEADER ================= */

    const headRow =
        document.createElement(
            "tr"
        );


    headers.forEach(header => {

        const th =
            document.createElement(
                "th"
            );


        th.textContent =
            header;


        headRow.appendChild(
            th
        );

    });


    tableHead.appendChild(
        headRow
    );


    /* ================= DATA ================= */

    data.forEach(row => {

        const tr =
            document.createElement(
                "tr"
            );


        headers.forEach(
            (header,index) => {

                const td =
                    document.createElement(
                        "td"
                    );


                const value =
                    row[index] || "";


                td.textContent =
                    value;


                /*
                   FREE
                */

                if(isFree(value)){

                    td.classList.add(
                        "free"
                    );

                }


                /*
                   FULL
                */

                else if(isFull(value)){

                    td.classList.add(
                        "full"
                    );

                }


                /*
                   OTHER
                */

                else{

                    td.classList.add(
                        "normal"
                    );

                }


                tr.appendChild(
                    td
                );

            }
        );


        tableBody.appendChild(
            tr
        );

    });


    countFreeLabs(data);

}


/* =====================================================
   APPLY FILTERS
===================================================== */

function applyFilters(){


    const selectedDay =
        document.getElementById(
            "dayFilter"
        ).value;


    const selectedRoom =
        document.getElementById(
            "roomFilter"
        ).value;


    const selectedCapacity =
        document.getElementById(
            "capacityFilter"
        ).value;


    const selectedPeriod =
        document.getElementById(
            "periodFilter"
        ).value;


    const dayIndex =
        findColumn([
            "Day",
            "DAY",
            "day"
        ]);


    const roomIndex =
        findColumn([
            "Room No.",
            "Room No",
            "Room",
            "ROOM NO",
            "ROOM"
        ]);


    const capacityIndex =
        findColumn([
            "Capacity",
            "Lab Capacity",
            "CAPACITY"
        ]);


    /*
       DAY / ROOM / CAPACITY
    */

    let filtered =
        allData.filter(row => {


            const dayMatch =
                selectedDay === "ALL" ||
                String(
                    row[dayIndex] || ""
                ).trim() ===
                selectedDay;


            const roomMatch =
                selectedRoom === "ALL" ||
                String(
                    row[roomIndex] || ""
                ).trim() ===
                selectedRoom;


            const capacityMatch =
                selectedCapacity === "ALL" ||
                String(
                    row[capacityIndex] || ""
                ).trim() ===
                selectedCapacity;


            return (
                dayMatch &&
                roomMatch &&
                capacityMatch
            );

        });


    /*
       PERIOD SELECTED

       Show ONLY FREE labs
    */

    if(selectedPeriod !== "ALL"){


        const periodIndex =
            findExactColumn(
                selectedPeriod
            );


        if(periodIndex !== -1){

            filtered =
                filtered.filter(
                    row =>
                        isFree(
                            row[periodIndex]
                        )
                );

        }

    }


    displayData(filtered);


    document.getElementById(
        "status"
    ).innerText =
        filtered.length +
        " lab records found";

}


/* =====================================================
   FREE DETECTION
===================================================== */

function isFree(value){


    if(
        value === null ||
        value === undefined
    ){

        return true;

    }


    const text =
        String(value)
            .trim()
            .toLowerCase();


    /*
       Empty = FREE
    */

    if(text === ""){

        return true;

    }


    return (

        text === "free" ||

        text === "available" ||

        text === "vacant" ||

        text === "idle"

    );

}


/* =====================================================
   FULL DETECTION
===================================================== */

function isFull(value){


    if(
        value === null ||
        value === undefined
    ){

        return false;

    }


    const text =
        String(value)
            .trim()
            .toLowerCase();


    return (

        text === "full" ||

        text === "occupied" ||

        text === "busy"

    );

}


/* =====================================================
   COUNT FREE LABS
===================================================== */

function countFreeLabs(data){


    const selectedPeriod =
        document.getElementById(
            "periodFilter"
        ).value;


    let count = 0;


    if(
        selectedPeriod !== "ALL"
    ){


        const index =
            findExactColumn(
                selectedPeriod
            );


        if(index !== -1){

            data.forEach(row => {

                if(
                    isFree(
                        row[index]
                    )
                ){

                    count++;

                }

            });

        }

    }

    else{

        count =
            data.length;

    }


    document.getElementById(
        "freeCount"
    ).innerText =
        "Free Labs: " + count;

}


/* =====================================================
   RESET FILTERS
===================================================== */

function resetFilters(){


    document.getElementById(
        "dayFilter"
    ).value = "ALL";


    document.getElementById(
        "roomFilter"
    ).value = "ALL";


    document.getElementById(
        "capacityFilter"
    ).value = "ALL";


    document.getElementById(
        "periodFilter"
    ).value = "ALL";


    /*
       Show all data
    */

    displayData(
        allData
    );


    document.getElementById(
        "status"
    ).innerText =
        "Showing all lab records";

}


/* =====================================================
   FIND COLUMN
===================================================== */

function findColumn(names){


    for(
        let i = 0;
        i < headers.length;
        i++
    ){

        const header =
            normalize(
                headers[i]
            );


        for(
            const name of names
        ){

            if(
                header ===
                normalize(name)
            ){

                return i;

            }

        }

    }


    return -1;

}


/* =====================================================
   EXACT COLUMN
===================================================== */

function findExactColumn(name){


    for(
        let i = 0;
        i < headers.length;
        i++
    ){

        if(
            normalize(
                headers[i]
            ) ===
            normalize(name)
        ){

            return i;

        }

    }


    return -1;

}


/* =====================================================
   NORMALIZE
===================================================== */

function normalize(value){

    return String(
        value || ""
    )
    .toLowerCase()
    .replace(/\s+/g,"")
    .replace(/[–—]/g,"-")
    .trim();

}


/* =====================================================
   UNIQUE VALUES
===================================================== */

function uniqueValues(index){


    const values =
        allData
            .map(
                row =>
                    String(
                        row[index] || ""
                    ).trim()
            )
            .filter(
                value =>
                    value !== ""
            );


    return [
        ...new Set(values)
    ];

}


/* =====================================================
   START WEBSITE
===================================================== */

loadSheet();

</script>

</body>
</html>
