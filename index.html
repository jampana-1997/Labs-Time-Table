<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MGIT Lab Time Tables | AY 2026-27</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f7fb;
    color:#1f2937;
}

.header{
    background:#123c69;
    color:white;
    padding:25px 20px;
    text-align:center;
}

.header h1{
    font-size:27px;
    margin-bottom:8px;
}

.header h2{
    font-size:18px;
    font-weight:normal;
    margin-bottom:5px;
}

.header p{
    font-size:15px;
    opacity:.9;
}

.container{
    max-width:1400px;
    margin:25px auto;
    padding:0 18px;
}

.controls{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.controls-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:15px;
}

.filters{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.filter-box label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:7px;
    color:#374151;
}

select{
    width:100%;
    padding:11px;
    border:1px solid #d1d5db;
    border-radius:7px;
    background:white;
    font-size:14px;
    outline:none;
}

select:focus{
    border-color:#2563eb;
}

.info{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:white;
    padding:15px 18px;
    border-radius:10px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.status{
    font-size:14px;
    color:#4b5563;
}

.free-count{
    font-weight:bold;
    color:#15803d;
}

.table-container{
    background:white;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:900px;
}

thead{
    background:#123c69;
    color:white;
}

th{
    padding:13px 10px;
    font-size:13px;
    white-space:nowrap;
    border-right:1px solid rgba(255,255,255,.2);
}

td{
    padding:12px 10px;
    text-align:center;
    border-bottom:1px solid #e5e7eb;
    border-right:1px solid #e5e7eb;
    font-size:13px;
}

tbody tr:hover{
    background:#f8fafc;
}

.free{
    color:#15803d;
    font-weight:bold;
    background:#dcfce7;
}

.busy{
    color:#b91c1c;
    font-weight:bold;
    background:#fee2e2;
}

.loading{
    text-align:center;
    padding:40px;
    font-size:16px;
    color:#6b7280;
}

.error{
    text-align:center;
    padding:30px;
    color:#b91c1c;
    background:#fee2e2;
    margin:20px 0;
    border-radius:10px;
}

.footer{
    text-align:center;
    padding:25px;
    color:#6b7280;
    font-size:13px;
}

/* Mobile */
@media(max-width:900px){
    .filters{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    .header h1{
        font-size:21px;
    }

    .header h2{
        font-size:15px;
    }

    .filters{
        grid-template-columns:1fr;
    }

    .info{
        flex-direction:column;
        gap:8px;
        align-items:flex-start;
    }
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <h1>Mahatma Gandhi Institute of Technology</h1>
    <h2>Training and Placement Cell</h2>
    <p>All Branches Labs Time Tables, AY 2026-27, Odd Semester</p>
</div>


<div class="container">

    <!-- FILTERS -->
    <div class="controls">

        <div class="controls-title">
            Find Free Labs
        </div>

        <div class="filters">

            <!-- DAY -->
            <div class="filter-box">
                <label>Day</label>
                <select id="dayFilter">
                    <option value="ALL">All Days</option>
                </select>
            </div>

            <!-- ROOM -->
            <div class="filter-box">
                <label>Room No.</label>
                <select id="roomFilter">
                    <option value="ALL">All Rooms</option>
                </select>
            </div>

            <!-- CAPACITY -->
            <div class="filter-box">
                <label>Lab Capacity</label>
                <select id="capacityFilter">
                    <option value="ALL">All Lab Capacities</option>
                </select>
            </div>

            <!-- PERIOD -->
            <div class="filter-box">
                <label>Select Period</label>
                <select id="periodFilter">
                    <option value="ALL">All Periods</option>
                </select>
            </div>

        </div>
    </div>


    <!-- INFORMATION -->
    <div class="info">

        <div class="status" id="status">
            Loading timetable...
        </div>

        <div class="free-count" id="freeCount">
            Free Labs: 0
        </div>

    </div>


    <!-- TABLE -->
    <div class="table-container">

        <div id="loading" class="loading">
            Loading data from Google Sheets...
        </div>

        <table id="labTable" style="display:none;">

            <thead id="tableHead"></thead>

            <tbody id="tableBody"></tbody>

        </table>

    </div>

</div>


<div class="footer">
    Mahatma Gandhi Institute of Technology | Training and Placement Cell
</div>


<script>

/* =========================================================
   GOOGLE SHEET CONFIGURATION
========================================================= */

const SHEET_ID =
"1PNgEr74LPmWGHzorRV_qvBhbc8sxhEFDjt3gjBtaFOY";

const SHEET_NAME = "Sheet1";


/*
   Google Visualization API
   This reads the Google Sheet directly.
*/

const GOOGLE_URL =
"https://docs.google.com/spreadsheets/d/" +
SHEET_ID +
"/gviz/tq?tqx=out:json&sheet=" +
encodeURIComponent(SHEET_NAME);


/* =========================================================
   GLOBAL DATA
========================================================= */

let allData = [];
let headers = [];


/* =========================================================
   TIME PERIOD DETECTION
========================================================= */

const periodNames = [
    "9.10 - 10.10",
    "10.10 - 11.10",
    "11.15 - 12.15",
    "12.15-1.00",
    "1.00 - 2.00",
    "2.00 - 3.00",
    "3.05 - 4.05"
];


/* =========================================================
   LOAD GOOGLE SHEET
========================================================= */

async function loadSheet(){

    try{

        const response = await fetch(GOOGLE_URL);

        if(!response.ok){
            throw new Error("Google Sheet could not be accessed.");
        }

        const text = await response.text();

        /*
           Google returns:
           google.visualization.Query.setResponse({...})
        */

        const jsonText =
            text.substring(
                text.indexOf("{"),
                text.lastIndexOf("}") + 1
            );

        const json = JSON.parse(jsonText);

        const table = json.table;

        headers = table.cols.map(col =>
            col.label || ""
        );

        allData = table.rows.map(row => {

            return row.c.map(cell => {

                if(cell === null){
                    return "";
                }

                return cell.f || cell.v || "";

            });

        });

        /*
           Remove completely empty rows
        */

        allData = allData.filter(row =>
            row.some(value =>
                String(value).trim() !== ""
            )
        );


        setupFilters();

        displayData(allData);

        document.getElementById("loading").style.display =
            "none";

        document.getElementById("labTable").style.display =
            "table";

        document.getElementById("status").innerText =
            "Timetable loaded successfully";

    }

    catch(error){

        console.error(error);

        document.getElementById("loading").innerHTML = `
            <div class="error">
                <strong>Unable to load Google Sheet</strong>
                <br><br>
                Please make sure the Google Sheet is shared as
                <b>Anyone with the link → Viewer</b>.
                <br><br>
                Also check the Sheet name in the code.
            </div>
        `;

    }

}


/* =========================================================
   CREATE FILTERS
========================================================= */

function setupFilters(){

    const dayFilter =
        document.getElementById("dayFilter");

    const roomFilter =
        document.getElementById("roomFilter");

    const capacityFilter =
        document.getElementById("capacityFilter");

    const periodFilter =
        document.getElementById("periodFilter");


    /*
       Find columns automatically
    */

    const dayIndex =
        findColumn([
            "Day",
            "DAY",
            "day"
        ]);

    const roomIndex =
        findColumn([
            "Room No.",
            "Room No",
            "Room",
            "ROOM NO",
            "ROOM"
        ]);

    const capacityIndex =
        findColumn([
            "Capacity",
            "Lab Capacity",
            "CAPACITY"
        ]);


    /* DAYS */

    if(dayIndex !== -1){

        const days = uniqueValues(dayIndex);

        days.forEach(day => {

            const option =
                document.createElement("option");

            option.value = day;
            option.textContent = day;

            dayFilter.appendChild(option);

        });

    }


    /* ROOMS */

    if(roomIndex !== -1){

        const rooms = uniqueValues(roomIndex);

        rooms.forEach(room => {

            const option =
                document.createElement("option");

            option.value = room;
            option.textContent = room;

            roomFilter.appendChild(option);

        });

    }


    /* CAPACITIES */

    if(capacityIndex !== -1){

        const capacities =
            uniqueValues(capacityIndex);

        capacities.sort((a,b) =>
            Number(a) - Number(b)
        );

        capacities.forEach(capacity => {

            const option =
                document.createElement("option");

            option.value = capacity;
            option.textContent = capacity;

            capacityFilter.appendChild(option);

        });

    }


    /*
       PERIODS
       Only add columns that actually exist
    */

    headers.forEach(header => {

        const cleanHeader =
            String(header).trim();

        if(
            periodNames.some(period =>
                normalize(period) ===
                normalize(cleanHeader)
            )
        ){

            const option =
                document.createElement("option");

            option.value = cleanHeader;

            option.textContent = cleanHeader;

            periodFilter.appendChild(option);

        }

    });


    /*
       Filter events
    */

    dayFilter.addEventListener(
        "change",
        applyFilters
    );

    roomFilter.addEventListener(
        "change",
        applyFilters
    );

    capacityFilter.addEventListener(
        "change",
        applyFilters
    );

    periodFilter.addEventListener(
        "change",
        applyFilters
    );

}


/* =========================================================
   DISPLAY DATA
========================================================= */

function displayData(data){

    const tableHead =
        document.getElementById("tableHead");

    const tableBody =
        document.getElementById("tableBody");


    tableHead.innerHTML = "";
    tableBody.innerHTML = "";


    /*
       Header
    */

    const headRow =
        document.createElement("tr");

    headers.forEach(header => {

        const th =
            document.createElement("th");

        th.textContent = header;

        headRow.appendChild(th);

    });

    tableHead.appendChild(headRow);


    /*
       Rows
    */

    data.forEach(row => {

        const tr =
            document.createElement("tr");

        headers.forEach((header,index) => {

            const td =
                document.createElement("td");

            const value =
                row[index] || "";

            td.textContent = value;

            /*
               FREE / BUSY styling
            */

            if(isFree(value)){
                td.classList.add("free");
            }

            else if(
                String(value)
                    .trim()
                    .toLowerCase() !== ""
            ){

                td.classList.add("busy");

            }

            tr.appendChild(td);

        });

        tableBody.appendChild(tr);

    });


    /*
       Count free labs
    */

    countFreeLabs(data);

}


/* =========================================================
   APPLY FILTERS
========================================================= */

function applyFilters(){

    const selectedDay =
        document.getElementById("dayFilter").value;

    const selectedRoom =
        document.getElementById("roomFilter").value;

    const selectedCapacity =
        document.getElementById("capacityFilter").value;

    const selectedPeriod =
        document.getElementById("periodFilter").value;


    const dayIndex =
        findColumn([
            "Day",
            "DAY",
            "day"
        ]);

    const roomIndex =
        findColumn([
            "Room No.",
            "Room No",
            "Room",
            "ROOM NO",
            "ROOM"
        ]);

    const capacityIndex =
        findColumn([
            "Capacity",
            "Lab Capacity",
            "CAPACITY"
        ]);


    let filtered =
        allData.filter(row => {

            const dayMatch =
                selectedDay === "ALL" ||
                String(row[dayIndex]).trim() ===
                selectedDay;

            const roomMatch =
                selectedRoom === "ALL" ||
                String(row[roomIndex]).trim() ===
                selectedRoom;

            const capacityMatch =
                selectedCapacity === "ALL" ||
                String(row[capacityIndex]).trim() ===
                selectedCapacity;

            return (
                dayMatch &&
                roomMatch &&
                capacityMatch
            );

        });


    /*
       IMPORTANT:
       If a period is selected,
       show ONLY FREE labs.
    */

    if(selectedPeriod !== "ALL"){

        const periodIndex =
            findExactColumn(selectedPeriod);

        if(periodIndex !== -1){

            filtered =
                filtered.filter(row =>
                    isFree(row[periodIndex])
                );

        }

    }


    displayData(filtered);


    document.getElementById("status").innerText =
        filtered.length +
        " lab records found";

}


/* =========================================================
   FREE LAB DETECTION
========================================================= */

function isFree(value){

    if(value === null ||
       value === undefined){

        return true;

    }

    const text =
        String(value)
            .trim()
            .toLowerCase();


    /*
       Empty cell = FREE
    */

    if(text === ""){
        return true;
    }


    /*
       Common FREE values
    */

    const freeValues = [
        "free",
        "available",
        "vacant",
        "idle",
        "-",
        "--",
        "0"
    ];


    return freeValues.includes(text);

}


/* =========================================================
   COUNT FREE LABS
========================================================= */

function countFreeLabs(data){

    const period =
        document.getElementById("periodFilter").value;


    let count = 0;


    if(period !== "ALL"){

        const index =
            findExactColumn(period);

        if(index !== -1){

            data.forEach(row => {

                if(isFree(row[index])){
                    count++;
                }

            });

        }

    }

    else{

        /*
           When all periods selected,
           count records available.
        */

        count = data.length;

    }


    document.getElementById("freeCount").innerText =
        "Free Labs: " + count;

}


/* =========================================================
   FIND COLUMN
========================================================= */

function findColumn(names){

    for(let i=0;i<headers.length;i++){

        const header =
            normalize(headers[i]);

        for(const name of names){

            if(
                header === normalize(name)
            ){

                return i;

            }

        }

    }

    return -1;

}


/* =========================================================
   EXACT PERIOD COLUMN
========================================================= */

function findExactColumn(name){

    for(let i=0;i<headers.length;i++){

        if(
            normalize(headers[i]) ===
            normalize(name)
        ){

            return i;

        }

    }

    return -1;

}


/* =========================================================
   NORMALIZE TEXT
========================================================= */

function normalize(value){

    return String(value || "")
        .toLowerCase()
        .replace(/\s+/g,"")
        .replace(/[–—]/g,"-")
        .trim();

}


/* =========================================================
   UNIQUE VALUES
========================================================= */

function uniqueValues(index){

    const values =
        allData
            .map(row =>
                String(row[index] || "").trim()
            )
            .filter(value =>
                value !== ""
            );


    return [...new Set(values)];

}


/* =========================================================
   START
========================================================= */

loadSheet();

</script>

</body>
</html>
